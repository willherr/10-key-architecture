name: Integrity Worker CI

on:
  push:
    branches: [main]
    paths:
      - "integrity-worker/**"
      - ".github/workflows/integrity-worker-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "integrity-worker/**"
      - ".github/workflows/integrity-worker-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrity-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrity-worker/package-lock.json
      - run: npm ci
      - run: npm test
